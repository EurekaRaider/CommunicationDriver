<!-- Diagram Design: architecture, doc-wide, balanced, engineer.

</head><body><main class="frame"><p class="eyebrow">SOURCE ARCHITECTURE</p><h1>CommunicationDriver architecture</h1><div class="diagram-container"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="architecture-title architecture-desc">
<title id="architecture-title">CommunicationDriver modular architecture</title>
<desc id="architecture-desc">Standalone C and C++ headers and C# bindings share a stable C ABI, a native connection core, and six independently configured backend modules for TCP, UDP, Serial, SSH, ADB, and CLI.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#cbd5e1"/></marker></defs>
<rect width="1280" height="720" fill="#080f21"/>
<text x="32" y="44" class="tag">COMMUNICATIONDRIVER / SOURCE ARCHITECTURE</text>
<text x="32" y="84" fill="#f1f5f9" font-family="Georgia, 'Times New Roman', serif" font-size="32">One public contract. Six independent backends.</text>
<text x="32" y="116" class="caption">Consistent calls, explicit module boundaries, one native async runtime.</text>
<g class="route" marker-end="url(#arrow)">
<line x1="292" y1="360" x2="332" y2="360"/>
<line x1="488" y1="360" x2="528" y2="360"/>
<path d="M868 236H892Q900 236 900 228V192Q900 184 908 184H1024"/>
<path d="M868 284H916Q924 284 924 276V268Q924 260 932 260H1024"/>
<line x1="868" y1="336" x2="1024" y2="336"/>
<path d="M868 388H940Q948 388 948 396V404Q948 412 956 412H1024"/>
<path d="M868 440H916Q924 440 924 448V480Q924 488 932 488H1024"/>
<path d="M868 492H892Q900 492 900 500V556Q900 564 908 564H1024"/>
</g>
<g data-node-id="public-api">
<rect x="32" y="196" width="260" height="328" rx="6" class="node"/>
<text x="52" y="224" class="tag">PUBLIC API / SINGLE HEADERS</text>
<text x="52" y="256" class="heading">One Connection API</text>
<line x1="52" y1="276" x2="272" y2="276" class="rule"/>
<text x="52" y="308" class="name">C</text>
<text x="52" y="332" class="detail">communicationdriver.h</text>
<text x="52" y="372" class="name">C++23</text>
<text x="52" y="396" class="detail">communicationdriver.hpp</text>
<text x="52" y="436" class="name">C# / .NET</text>
<text x="52" y="460" class="detail">Api / Options / Results</text>
<text x="52" y="500" class="caption">+ platform library files</text>
</g>
<g data-node-id="c-abi">
<rect x="332" y="312" width="156" height="96" rx="6" class="node"/>
<text x="348" y="340" class="name">Stable C ABI</text>
<text x="348" y="364" class="detail">src/c_api/</text>
<text x="348" y="388" class="caption">opaque handles</text>
</g>
<g data-node-id="native-core">
<rect x="528" y="176" width="340" height="360" rx="6" class="core"/>
<text x="548" y="208" class="tag">SHARED NATIVE CORE</text>
<text x="548" y="244" class="heading">Connection + Runtime</text>
<text x="548" y="272" class="detail">core/</text>
<text x="548" y="300" class="caption">Queue / cancel / close / batch</text>
<line x1="548" y1="320" x2="848" y2="320" class="rule"/>
<text x="548" y="352" class="name">Response processing</text>
<text x="548" y="380" class="detail">execution/</text>
<text x="548" y="408" class="caption">Boundaries / decoding / checks</text>
<line x1="548" y1="428" x2="848" y2="428" class="rule"/>
<text x="548" y="460" class="name">Backend contract</text>
<text x="548" y="488" class="detail">core/backend.hpp</text>
<text x="548" y="516" class="caption">Typed factory / capabilities</text>
</g>
<g data-node-id="backend-tcp"><rect x="1024" y="152" width="224" height="64" rx="6" class="node"/><text x="1040" y="176" class="name">TCP</text><text x="1040" y="200" class="detail">TcpBackend / tcp/</text></g>
<g data-node-id="backend-udp"><rect x="1024" y="228" width="224" height="64" rx="6" class="node"/><text x="1040" y="252" class="name">UDP</text><text x="1040" y="276" class="detail">UdpBackend / udp/</text></g>
<g data-node-id="backend-serial"><rect x="1024" y="304" width="224" height="64" rx="6" class="node"/><text x="1040" y="328" class="name">Serial</text><text x="1040" y="352" class="detail">SerialBackend / serial/</text></g>
<g data-node-id="backend-ssh"><rect x="1024" y="380" width="224" height="64" rx="6" class="node"/><text x="1040" y="404" class="name">SSH / SFTP</text><text x="1040" y="428" class="detail">SshBackend / ssh/</text></g>
<g data-node-id="backend-adb"><rect x="1024" y="456" width="224" height="64" rx="6" class="node"/><text x="1040" y="480" class="name">ADB</text><text x="1040" y="504" class="detail">AdbBackend / adb/</text></g>
<g data-node-id="backend-cli"><rect x="1024" y="532" width="224" height="64" rx="6" class="node"/><text x="1040" y="556" class="name">CLI</text><text x="1040" y="580" class="detail">CliBackend / cli/</text></g>
<text x="32" y="600" class="caption">Six modules: src/backends/{tcp, udp, serial, ssh, adb, cli}/</text>
<text x="32" y="628" class="caption">Shared backend components: ProcessChannel / ShellSession / platform process adapters</text>
<line x1="32" y1="652" x2="1248" y2="652" class="rule"/>
<rect x="32" y="676" width="12" height="12" rx="2" class="core"/><text x="56" y="688" class="caption">Shared core</text>
<rect x="244" y="676" width="12" height="12" rx="2" class="node"/><text x="268" y="688" class="caption">Independent module</text>
<text x="568" y="688" class="caption">Arrows: operation dispatch; async callbacks omitted.</text>
</svg></div></main></body></html>
