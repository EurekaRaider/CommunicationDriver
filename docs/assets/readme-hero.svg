<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">CommunicationDriver — One core. Every connection.</title>
  <desc id="desc">A dark blue circuit illustration connects TCP, UDP, Serial, SSH, ADB and CLI to one native async core. C++23, a stable C ABI and .NET share the implementation.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#080f21"/>
      <stop offset="1" stop-color="#101b34"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#0e7490" stop-opacity=".25"/>
      <stop offset="1" stop-color="#0e7490" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x2="1" y2=".3">
      <stop stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#a5b4fc"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#c7d2fe" stroke-opacity=".045"/>
    </pattern>
  </defs>
  <rect width="1200" height="420" rx="20" fill="url(#background)"/>
  <rect x="1" y="1" width="1198" height="418" rx="19" fill="url(#grid)" stroke="#334155" stroke-opacity=".7"/>
  <ellipse cx="942" cy="190" rx="275" ry="220" fill="url(#halo)"/>
  <path d="M64 36H176" stroke="#67e8f9" stroke-width="3"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
    <text x="64" y="75" fill="#94a3b8" font-size="12" font-weight="600" letter-spacing="3">COMMUNICATIONDRIVER</text>
    <text x="60" y="151" fill="#f1f5f9" font-size="64" font-weight="700" letter-spacing="-2">One core.</text>
    <text x="60" y="222" fill="url(#accent)" font-size="64" font-weight="700" letter-spacing="-2">Every connection.</text>
    <text x="64" y="261" fill="#94a3b8" font-size="17">Unified communication. Native async execution.</text>
    <g fill="#131f38" stroke="#334155">
      <rect x="64" y="287" width="92" height="30" rx="6"/>
      <rect x="166" y="287" width="130" height="30" rx="6"/>
      <rect x="306" y="287" width="80" height="30" rx="6"/>
