name: Release
on:
  workflow_run:
    workflows: [Platform CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful Platform CI run for this main commit
        required: true
        type: string
permissions:
  actions: read
  contents: read
env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_REPO: ${{ github.repository }}
  CI_RUN_ID: ${{ github.event.workflow_run.id || inputs.ci_run_id }}
  RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
jobs:
  plan:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_COMMIT }}
          persist-credentials: false
      - name: Check successful CI and unpublished version
        id: release
        run: |
          mkdir -p artifacts
          [[ "$CI_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GH_REPO/actions/runs/$CI_RUN_ID" > artifacts/ci-run.json
          python scripts/publish_release.py --ci-run artifacts/ci-run.json --commit "$RELEASE_COMMIT" --check
  publish:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    concurrency:
      group: release-${{ needs.plan.outputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_COMMIT }}
          persist-credentials: false
      - name: Prepare verified CI assets
        run: |
          mkdir -p artifacts
          [[ "$CI_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GH_REPO/actions/runs/$CI_RUN_ID" > artifacts/ci-run.json
          python scripts/prepare_release.py --ci-run artifacts/ci-run.json --commit "$RELEASE_COMMIT" --verify-only
          gh run download "$CI_RUN_ID" --dir artifacts/release-input
          python scripts/prepare_release.py --ci-run artifacts/ci-run.json --commit "$RELEASE_COMMIT"
      - name: Publish or resume GitHub Release
        run: python scripts/publish_release.py --ci-run artifacts/ci-run.json --commit "$RELEASE_COMMIT"
